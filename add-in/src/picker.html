<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Sling-Mac — Zielordner</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; font-size: 13px; background: #fff; color: #1a1a1a; }
    #search { width: 100%; padding: 8px 10px; border: none; border-bottom: 1px solid #ddd; font-size: 13px; outline: none; }
    #list { overflow-y: auto; height: calc(100vh - 72px); }
    .folder { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .folder:hover, .folder.selected { background: #0078d4; color: #fff; }
    #footer { position: fixed; bottom: 0; width: 100%; display: flex; gap: 8px; padding: 8px; background: #f8f8f8; border-top: 1px solid #ddd; }
    button { flex: 1; padding: 7px; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #btn-sling { background: #0078d4; color: #fff; }
    #btn-sling:disabled { background: #aaa; }
    #btn-cancel { background: #e0e0e0; }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Ordner suchen…" />
  <div id="list"></div>
  <div id="footer">
    <button id="btn-cancel">Abbrechen</button>
    <button id="btn-sling" disabled>Sling</button>
  </div>

  <script>
    let allFolders = [];
    let selected = null;

    Office.onReady(async () => {
      try {
        const resp = await fetch("https://localhost:7331/folders");
        const data = await resp.json();
        allFolders = data.folders || [];
        selected = data.default || null;
        render(allFolders);
      } catch (e) {
        document.getElementById("list").textContent = "Fehler: " + e.message;
      }
    });

    function render(folders) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      folders.forEach(f => {
        const div = document.createElement("div");
        div.className = "folder" + (f.path === selected ? " selected" : "");
        div.textContent = f.label;
        div.addEventListener("click", () => {
          selected = f.path;
          document.querySelectorAll(".folder").forEach(el => el.classList.remove("selected"));
          div.classList.add("selected");
          document.getElementById("btn-sling").disabled = false;
        });
        list.appendChild(div);
      });
      if (selected) document.getElementById("btn-sling").disabled = false;
    }

    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      render(allFolders.filter(f => f.label.toLowerCase().includes(q)));
    });

    document.getElementById("btn-sling").addEventListener("click", () => {
      if (selected) Office.context.ui.messageParent(selected);
    });

    document.getElementById("btn-cancel").addEventListener("click", () => {
      Office.context.ui.messageParent("__cancel__");
    });
  </script>
</body>
</html>
